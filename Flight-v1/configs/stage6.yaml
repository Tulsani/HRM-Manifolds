system:
  checkpoint: checkpoints/full_system_stage5.pt
  device: cuda
  dtype: bfloat16

fine_tuning:
  enabled: true
  steps: 300
  batch_size: 8
  gradient_accumulation: 8
  lr: 5e-5
  gradient_clip: 0.5
  warmup_steps: 20
  early_stop_delta: 0.03
  lambda_1: 1.5
  lambda_2: 0.5
  lambda_3: 0.3
  lambda_4: 0.2
  hard_example_oversample: 2.0
  min_hard_examples: 500

calibration:
  head_temp_steps: 30
  head_temp_range: [0.5, 3.0]
  abstain_cost_wrong: 1.0
  abstain_cost_abstain: 0.3
  abstain_search_steps: 17
  abstain_range: [0.1, 0.9]

evaluation:
  gsm8k_full: true
  math500_full: true
  subskill_calibration: true
  ood: true
  ablations: true
  baselines: true

output:
  finetuned_checkpoint: checkpoints/system_finetuned.pt
  final_checkpoint: checkpoints/final.pt
  final_report: outputs/final_report.md
  abstain_config: outputs/abstain_threshold.json
  eval_results: outputs/stage6_eval.json
